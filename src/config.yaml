frame_stride: 10
point_stride: 10
min_depth: 0.5
max_depth: 6.0
downsample_rate: 3
weights: ViT-B/32
logic: patch
interpolation_k: 21

sam3d:
  voxel_size: 0.01
  points_per_side: 32
  pred_iou_thresh: 0.8
  stability_score_thresh: 0.8
  min_mask_region_area: 200
  th: 1000
  group_overlap_ratio: 0.2
  voxel_search_multiplier: 1.5

clip:
  threshold: 0.01

interpolation: {}

# Fallback intrinsics used when a scene has no intrinsics.json.
# ScanNet scenes always have intrinsics.json (written by prepare_scene.py).
default_intrinsics:
  fx: 577.870605
  fy: 577.870605
  cx: 319.5
  cy: 239.5

